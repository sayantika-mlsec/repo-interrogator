# Repo Interrogator — pinned evaluation set
#
# Every repo below is pinned to a commit SHA. Nothing here is edited once the
# first evaluation run has happened: the whole point of pinning is that the code
# under test cannot move while the agent changes.
#
# Three groups, three different jobs:
#
#   dev             - used freely during development. Inspected, debugged,
#                     labeled, and re-run as often as needed.
#
#   held_out        - never inspected during development. Scored exactly twice:
#                     once as a baseline before any tuning, once at the end.
#                     Reading, labeling, or debugging against these repos at any
#                     other point invalidates the final number.
#
#   memorization    - outside both sets. Used only for a blind run with no tools,
#                     to estimate how much apparent understanding is training-data
#                     recall rather than actual code reading. Both are far more
#                     widely known than any held-out repo, so an inflated blind
#                     score here is an upper bound on that effect, not a point
#                     estimate.
 
