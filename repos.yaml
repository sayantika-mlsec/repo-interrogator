# --- Selection notes, recorded before any tool code existed ---
#
# The held-out set deliberately spans four unrelated problem domains: async I/O,
# command-line parsing, structured logging, and SQL parsing. None of them shares
# a problem space with a dev repo.
#
# `outlines` was considered for the held-out set and rejected. It solves the same
# problem as `instructor` (constrained/structured LLM output), which would have
# made the final held-out score a blend of two different penalties - "the agent
# has not seen this repo" and "the agent has not seen this kind of code" - with
# no way to separate them. `sqlglot` was chosen instead for a clean gap.
#
# All ten repos are Python. Behaviour on non-Python repositories is therefore
# never exercised by this evaluation set and must be handled explicitly in the
# clone/scaffolding layer, either by rejecting them clearly or by degrading to
# text search without structural symbol extraction.